<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/jquery-3.7.1.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/favicon.ico">
    <title>Delback</title>
</head>
<body>
    <div class="error" id="error" style="display: none;">
        <div class="errormodal">
            <h1>Error</h1>
            <p id="error_message">申し訳ございません！<br>
                エラーが発生しました！<br>
                なお、エラーの詳細はわかりませんでした。</p>
            <button id="error_okay">OK</button>
        </div>
    </div>

    <header>
        <h1>Delback</h1>
    </header>
    <main>
        <div class="Image_zone">
            <img id="previewImage" src="/img/color_bar2.png">
        </div>
        <div class="Upload_zone">
            <label class="imgbtn" for="fileImage">ファイル選択
                <input id="fileImage" type="file" accept="image/*"/>
            </label>
            <p>選択もしくはドラッグ&ドロップもしくはペースト</p>
        </div>
        <div class="Send_zone">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAA1rGIuf2Q3VOPFw" data-callback="checkCLTurnstile" data-expired-callback="resetCLTurnstile"></div>
            <button id="send" class="imgbtn" disabled>送信</button>
        </div>
        <div class="loading">
            <h1>✂️</h1>
            <p>切り抜き中...</p>
        </div>
        <div class="Download_zone">
            <p>切り抜き終わりました！✌️<br>ダウンロードが可能です！</p>
            <a id="download" href="#" class="imgbtn" download="delback_result.png">ダウンロード</a>
            <hr>
            <a onclick="window.location.reload(true);" class="imgbtn">はじめから</a>
        </div>
    </main>
    <footer>
        <a href="https://daichimarukana.com"><span>@daichimarukana</span></a>
        <a href="terms.html">利用規約</a>
        <a href="privacy_policy.html">プライバシーポリシー</a>
    </footer>
</body>
</html>
<script>
    var imagedata = null;
    var loading = false;
    var cloudflare_turnstile = false;
    var currentObjectUrl = null;

    function chgImage(file) {
        if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
        }
        currentObjectUrl = URL.createObjectURL(file);
        $('#previewImage').attr('src', currentObjectUrl);
    }

    function downloadImage(blobUrl, originalName) {
        var baseName = originalName ? originalName.replace(/\.[^/.]+$/, "") : "delback_result";
        $("#download").attr("href", blobUrl);
        $("#download").attr("download", baseName + "_cutout.png");
    }

    function checkCLTurnstile() {
        cloudflare_turnstile = true;
        inputCheck();
    }

    function resetCLTurnstile() {
        cloudflare_turnstile = false;
        $("#send").attr('disabled', true);
    }

    function inputCheck() {
        var chk1 = $("#fileImage")[0];
        if (chk1.files.length > 0 && cloudflare_turnstile === true) {
            $("#send").attr('disabled', false);
        }
    }

    function sendImage(file) {
        if (loading || !file) return;

        var cf_response = $('.cf-turnstile input[name="cf-turnstile-response"]').val();
        var formData = new FormData();
        formData.append("image", file);
        formData.append("captcha", cf_response);

        loading = true;
        $(".loading").show();
        $(".Upload_zone").hide();
        $(".Send_zone").hide();

        fetch('https://delback-server.emptybox.win/', {
            method: 'POST',
            body: formData
        })
        .then(async function(response) {
            if (!response.ok) {
                let errorText = "エラーが発生しました (" + response.status + ")";
                try {
                    const errJson = await response.json();
                    if (errJson.error) errorText = errJson.error;
                } catch (e) {}
                throw new Error(errorText);
            }
            return response.blob();
        })
        .then(function(blob) {
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
            }
            currentObjectUrl = URL.createObjectURL(blob);
            $('#previewImage').attr('src', currentObjectUrl);
            loading = false;
            $(".loading").hide();
            $(".Download_zone").show();
            downloadImage(currentObjectUrl, file.name);
        })
        .catch(function(error) {
            loading = false;
            $(".loading").hide();
            if (typeof turnstile !== "undefined") {
                turnstile.reset();
            }
            resetCLTurnstile();
            view_error(error.message || "通信エラーが発生しました");
        });
    }

    function view_error(errormsg) {
        $("#error_message").html(String(errormsg).replace(/\n/g, '<br>'));
        $("#error").show();
        console.error(errormsg);
    }

    $(document).ready(function() {
        var $fileArea = $('body');
        var $fileInput = $('#fileImage');

        $fileArea.on('dragover', function(evt) {
            evt.preventDefault();
            $fileArea.addClass('dragover');
        });

        $fileArea.on('dragleave', function(evt) {
            evt.preventDefault();
            $fileArea.removeClass('dragover');
        });

        $fileArea.on('drop', function(evt) {
            evt.preventDefault();
            $fileArea.removeClass('dragover');

            var files = evt.originalEvent.dataTransfer.files;
            if (files.length > 0) {
                $fileInput.prop('files', files);
                chgImage(files[0]);
                imagedata = files[0];
                inputCheck();
            }
        });

        $fileInput.on('change', function(e) {
            if (e.target.files.length > 0) {
                chgImage(e.target.files[0]);
                imagedata = e.target.files[0];
                inputCheck();
            }
        });

        $("#send").on("click", function() {
            sendImage(imagedata);
        });

        $(document).on('paste', function(event) {
            const items = event.originalEvent.clipboardData.items;
            let file = null;

            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf("image") === 0) {
                    file = items[i].getAsFile();
                    break;
                }
            }
            if (file) {
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                $fileInput[0].files = dataTransfer.files;

                chgImage(file);
                imagedata = file;
                inputCheck();
            }
        });

        $("#error_okay").on('click', function() {
            $("#error").hide();
            window.location.reload(true);
        });
    });
</script>
